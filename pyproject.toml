[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhirground"
version = "1.0.0"
description = "Grounded, validated FHIR R4 extraction from clinical notes: the LLM emits mentions, deterministic code emits FHIR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Palacios", email = "daniel.palacios@bcm.edu" }]
keywords = [
    "fhir",
    "clinical-nlp",
    "llm",
    "interoperability",
    "structured-extraction",
    "terminology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2.6",
    # Pinned deliberately. R4 (4.0.1) models exist only in the 6.x line, which
    # is pydantic v1 only; 7.x and later are R5 at the top level with an R4B
    # subpackage. fhirground uses R4B. See docs/decisions.md D-002.
    "fhir.resources>=8.0,<9",
    "rapidfuzz>=3.6",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
calibrate = ["scikit-learn>=1.4", "numpy>=1.26"]
rxnav = []
all = ["boto3>=1.34", "scikit-learn>=1.4", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/DanPalBCM/fhirground"
Repository = "https://github.com/DanPalBCM/fhirground"
Issues = "https://github.com/DanPalBCM/fhirground/issues"

[project.scripts]
fhirground = "fhirground.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "boto3>=1.34",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fhirground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "live_bedrock: needs AWS credentials and network; skipped unless FHIRGROUND_LIVE_BEDROCK is set",
    "live_vllm: needs a running vLLM server; skipped unless FHIRGROUND_LIVE_VLLM is set",
    "live_rxnav: needs network access to NLM RxNav; skipped unless FHIRGROUND_LIVE_RXNAV is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["fhirground"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["fhirground"]
